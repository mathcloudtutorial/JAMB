<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c9a227">
  <meta name="description" content="MathCloud Tutorial JAMB preparation platform. Choose student learning or administrator access.">
  <title>MathCloud Tutorial | JAMB Preparation</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="shared/styles.css">
  <link rel="stylesheet" href="pwa.css">
  <link rel="icon" href="assets/logo.png">
  <style>
    :root { color-scheme: light; }
    body { margin:0; min-height:100vh; background:linear-gradient(135deg,#f5f8ff 0%,#fffdf5 100%); color:#172033; font-family:Inter, Nunito, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .entry-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px; box-sizing:border-box; }
    .entry-card { width:min(920px,100%); background:#fff; border:1px solid #e7eaf0; border-radius:26px; box-shadow:0 24px 70px rgba(24,39,75,.12); overflow:hidden; }
    .entry-head { text-align:center; padding:36px 24px 26px; background:linear-gradient(135deg,#102a56,#174a83); color:white; }
    .entry-logo { width:78px; height:78px; object-fit:contain; border-radius:20px; background:white; padding:7px; box-sizing:border-box; }
    .entry-head h1 { margin:16px 0 8px; font-size:clamp(1.7rem,4vw,2.5rem); line-height:1.15; }
    .entry-head p { margin:0 auto; max-width:620px; color:#e4edff; line-height:1.6; }
    .entry-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; padding:26px; }
    .entry-option { display:flex; flex-direction:column; align-items:flex-start; padding:24px; border:1px solid #e5eaf2; border-radius:18px; background:#fff; text-decoration:none; color:inherit; transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease; }
    .entry-option:hover,.entry-option:focus-visible { transform:translateY(-3px); border-color:#c9a227; box-shadow:0 12px 28px rgba(24,39,75,.1); outline:none; }
    .entry-icon { width:48px; height:48px; display:grid; place-items:center; border-radius:14px; background:#fff5d7; color:#6d5200; font-size:1.5rem; }
    .entry-option h2 { margin:17px 0 8px; font-size:1.25rem; }
    .entry-option p { margin:0 0 20px; color:#596579; line-height:1.6; flex:1; }
    .entry-cta { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 18px; border-radius:12px; background:#c9a227; color:#172033; font-weight:800; }
    .entry-foot { padding:0 24px 24px; text-align:center; color:#667085; font-size:.9rem; }
    @media(max-width:620px) { .entry-options { grid-template-columns:1fr; padding:18px; } .entry-head { padding:28px 18px 22px; } .entry-option { padding:20px; } }
  </style>
</head>
<body>
  <main class="entry-wrap">
    <section class="entry-card" aria-labelledby="page-title">
      <header class="entry-head">
        <img class="entry-logo" src="assets/logo.png" alt="MathCloud Tutorial logo">
        <h1 id="page-title">MathCloud Tutorial</h1>
        <p>JAMB Preparation Platform — choose the portal you want to open.</p>
      </header>
      <div class="entry-options">
        <a class="entry-option" href="student/index.html">
          <span class="entry-icon" aria-hidden="true">🎓</span>
          <h2>Student Portal</h2>
          <p>Sign in or register to access lessons, topic practice, mock examinations, and your results.</p>
          <span class="entry-cta">Open Student Portal →</span>
        </a>

      </div>
      <footer class="entry-foot">© MathCloud Tutorial · Learn, practise, and prepare with confidence.</footer>
    </section>
  </main>
  <script src="/pwa.js"></script>
</body>
</html>
